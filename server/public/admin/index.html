<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WayPoint AI · Админ-панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,400..700,0..1" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23007AFF'/><stop offset='1' stop-color='%2300C2BB'/></linearGradient></defs><rect rx='24' width='100' height='100' fill='url(%23g)'/><path d='M50 22c-11 0-20 9-20 20 0 15 20 36 20 36s20-21 20-36c0-11-9-20-20-20zm0 27a7 7 0 110-14 7 7 0 010 14z' fill='white'/></svg>">
</head>
<body>
  <!-- Экран логина -->
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-card">
      <div class="logo-mark big"><span class="material-symbols-rounded">distance</span></div>
      <h1>WayPoint <em>AI</em></h1>
      <p>Панель администратора</p>
      <form id="loginForm">
        <label>Email
          <input type="email" id="loginEmail" placeholder="admin@waypoint.ai" required>
        </label>
        <label>Пароль
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </label>
        <div id="loginError" class="login-error hidden"></div>
        <button class="btn btn-primary" type="submit">
          <span class="material-symbols-rounded">login</span>Войти
        </button>
      </form>
    </div>
  </div>

  <!-- Приложение -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <a class="logo" href="#/dashboard">
        <span class="logo-mark"><span class="material-symbols-rounded">distance</span></span>
        <span>WayPoint <em>AI</em></span>
      </a>
      <nav>
        <a href="#/dashboard" data-route="dashboard"><span class="material-symbols-rounded">dashboard</span>Дашборд</a>
        <a href="#/users" data-route="users"><span class="material-symbols-rounded">group</span>Пользователи</a>
        <a href="#/trips" data-route="trips"><span class="material-symbols-rounded">luggage</span>Поездки</a>
        <a href="#/chats" data-route="chats"><span class="material-symbols-rounded">forum</span>Чаты с ИИ</a>
        <a href="#/notifications" data-route="notifications"><span class="material-symbols-rounded">notifications</span>Уведомления</a>
        <a href="#/settings" data-route="settings"><span class="material-symbols-rounded">settings</span>Настройки</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sys-pill" id="sysPill"><span class="dot"></span><span id="sysPillText">…</span></div>
        <button class="btn-logout" id="logoutBtn"><span class="material-symbols-rounded">logout</span>Выйти</button>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal-backdrop hidden"><div class="modal" id="modalBody"></div></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
